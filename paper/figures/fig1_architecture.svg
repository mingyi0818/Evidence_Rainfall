Adjust="spacing" textLength="342.7551" x="259.375" y="1498.6084">z_k = w_k^T h + b_k</text><text fill="#000000" font-family="'Arial'" font-size="37.5" lengthAdjust="spacing" textLength="315.7654" x="259.375" y="1541.7297">e_k = softplus(z_k)</text></g><!--entity DIR--><g class="entity" data-qualified-name="DIR" data-source-line="32" id="ent0008"><rect fill="#D5E8D4" height="148.7427" rx="15.625" ry="15.625" style="stroke:#2C3E50;stroke-width:4.6875;" width="491.8274" x="835.9375" y="1767.1875"/><text fill="#000000" font-family="'Arial'" font-size="37.5" lengthAdjust="spacing" textLength="429.3274" x="867.1875" y="1833.6121">Dirichlet Parameterization</text><text fill="#000000" font-family="'Arial'" font-size="37.5" lengthAdjust="spacing" textLength="305.3101" x="867.1875" y="1876.7334">a_k = e_k + a^0_k</text></g><!--entity PRED--><g class="entity" data-qualified-name="PRED" data-source-line="39" id="ent0012"><rect fill="#FFE6CC" height="191.864" rx="15.625" ry="15.625" style="stroke:#2C3E50;stroke-width:4.6875;" width="425.1404" x="93.75" y="2104.6875"/><text fill="#000000" font-family="'Arial'" font-size="37.5" lengthAdjust="spacing" textLength="362.6404" x="125" y="2171.1121">Predictive Distribution</text><text fill="#000000" font-family="'Arial'" font-size="37.5" lengthAdjust="spacing" textLength="292.9138" x="125" y="2214.2334">p_hat_k = a_k / S</text><text fill="#000000" font-family="'Arial'" font-size="37.5" lengthAdjust="spacing" textLength="213.6108" x="125" y="2257.3547">S = sum(a_j)</text></g><!--entity LOSS--><g class="entity" data-qualified-name="LOSS" data-source-line="47" id="ent0017"><rect fill="#E1D5E7" height="148.7427" rx="15.625" ry="15.625" style="stroke:#2C3E50;stroke-width:4.6875;" width="589.917" x="629.6875" y="2125"/><text fill="#000000" font-family="'Arial'" font-size="37.5" lengthAdjust="spacing" textLength="389.7583" x="660.9375" y="2191.4246">Masked KL Regularizer</text><text fill="#000000" font-family="'Arial'" font-size="37.5" lengthA